<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSAR Browser Compatibility</title>
    <style>
        /* Reset and base styles */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; }
        
        /* Layout utilities */
        .container { max-width: 1280px; margin: 0 auto; padding: 0 1rem; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-4 { gap: 1rem; }
        .gap-2 { gap: 0.5rem; }
        
        /* Grid */
        .grid { display: grid; }
        .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        .grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        
        /* Spacing */
        .p-4 { padding: 1rem; }
        .p-6 { padding: 1.5rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-6 { padding-top: 1.5rem; padding-bottom: 1.5rem; }
        .py-12 { padding-top: 3rem; padding-bottom: 3rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .mt-2 { margin-top: 0.5rem; }
        .mt-4 { margin-top: 1rem; }
        
        /* Typography */
        .text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
        .text-lg { font-size: 1.125rem; line-height: 1.75rem; }
        .text-2xl { font-size: 1.5rem; line-height: 2rem; }
        .text-sm { font-size: 0.875rem; line-height: 1.25rem; }
        .text-xs { font-size: 0.75rem; line-height: 1rem; }
        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .font-medium { font-weight: 500; }
        .font-mono { font-family: ui-monospace, SFMono-Regular, monospace; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        
        /* Colors */
        .text-gray-900 { color: #111827; }
        .text-gray-800 { color: #1f2937; }
        .text-gray-700 { color: #374151; }
        .text-gray-600 { color: #4b5563; }
        .text-gray-500 { color: #6b7280; }
        .text-gray-400 { color: #9ca3af; }
        .text-white { color: #ffffff; }
        .text-blue-600 { color: #2563eb; }
        .text-blue-800 { color: #1e40af; }
        .text-green-600 { color: #16a34a; }
        .text-green-800 { color: #166534; }
        .text-yellow-600 { color: #ca8a04; }
        .text-red-800 { color: #991b1b; }
        .text-red-400 { color: #f87171; }
        .text-jsar { color: #3B82F6; }
        
        .bg-gray-50 { background-color: #f9fafb; }
        .bg-gray-100 { background-color: #f3f4f6; }
        .bg-white { background-color: #ffffff; }
        .bg-jsar { background-color: #3B82F6; }
        .bg-green-100 { background-color: #dcfce7; }
        .bg-green-600 { background-color: #16a34a; }
        .bg-yellow-100 { background-color: #fef3c7; }
        .bg-yellow-600 { background-color: #ca8a04; }
        .bg-red-100 { background-color: #fee2e2; }
        .bg-blue-600 { background-color: #2563eb; }
        
        /* Borders */
        .border { border-width: 1px; }
        .border-b { border-bottom-width: 1px; }
        .border-l-4 { border-left-width: 4px; }
        .border-gray-300 { border-color: #d1d5db; }
        .border-blue-500 { border-color: #3b82f6; }
        .border-green-500 { border-color: #10b981; }
        .border-purple-500 { border-color: #8b5cf6; }
        .border-gray-500 { border-color: #6b7280; }
        .rounded { border-radius: 0.25rem; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-md { border-radius: 0.375rem; }
        
        /* Shadows */
        .shadow-sm { box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); }
        
        /* Sizing */
        .w-full { width: 100%; }
        .h-12 { height: 3rem; }
        .w-12 { width: 3rem; }
        .min-h-screen { min-height: 100vh; }
        
        /* Positioning */
        .relative { position: relative; }
        
        /* Display */
        .hidden { display: none; }
        .block { display: block; }
        
        /* Animations */
        .animate-spin { animation: spin 1s linear infinite; }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Form elements */
        input, select {
            padding: 0.5rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            font-size: 0.875rem;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgb(59 130 246 / 0.1);
        }
        
        /* Custom styles */
        .category-grid {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        }
        .api-item {
            transition: all 0.2s ease-in-out;
        }
        .api-item:hover {
            transform: translateY(-2px);
        }
        
        /* Badge styles */
        .badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-weight: 500;
        }
        
        /* Link styles */
        a {
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        
        /* Responsive */
        @media (min-width: 640px) {
            .sm\\:flex-row { flex-direction: row; }
            .sm\\:px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        }
        @media (min-width: 768px) {
            .md\\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
            #stats-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }
        @media (min-width: 1024px) {
            .lg\\:px-8 { padding-left: 2rem; padding-right: 2rem; }
        }
        
        /* Space utilities */
        .space-y-3 > * + * { margin-top: 0.75rem; }
        
        /* Flex utilities */
        .flex-1 { flex: 1 1 0%; }
        
        /* Overflow */
        .overflow-hidden { overflow: hidden; }
    </style>
    <style>
        .category-grid {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        }
        .api-item {
            transition: all 0.2s ease-in-out;
        }
        .api-item:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="container py-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">JSAR Browser Compatibility</h1>
                    <p class="text-gray-600 mt-2">Web APIs and HTML Elements supported by JSAR Runtime</p>
                </div>
                <div class="text-right">
                    <div class="text-sm text-gray-500">Runtime Version</div>
                    <div class="text-lg font-semibold text-jsar">0.8.2</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Search and Filter -->
    <div class="container py-6">
        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
            <div class="flex flex-col gap-4" id="filters">
                <div class="flex-1">
                    <label for="search" class="block text-sm font-medium text-gray-700 mb-2">Search APIs</label>
                    <input type="text" id="search" placeholder="Search for APIs, elements, or features..." class="w-full">
                </div>
                <div class="flex gap-4">
                    <div>
                        <label for="category" class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                        <select id="category">
                            <option value="all">All Categories</option>
                            <option value="api">Web APIs</option>
                            <option value="html">HTML Elements</option>
                            <option value="global">Global Attributes</option>
                        </select>
                    </div>
                    <div>
                        <label for="version" class="block text-sm font-medium text-gray-700 mb-2">Version</label>
                        <select id="version">
                            <option value="all">All Versions</option>
                            <option value="0.4.0">0.4.0+</option>
                            <option value="0.5.0">0.5.0+</option>
                            <option value="0.6.0">0.6.0+</option>
                            <option value="0.7.0">0.7.0+</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats -->
    <div class="container mb-6">
        <div class="grid grid-cols-1 gap-4" id="stats-grid">
            <div class="bg-white rounded-lg shadow-sm p-4">
                <div class="text-2xl font-bold text-jsar" id="total-apis">-</div>
                <div class="text-sm text-gray-600">Total APIs</div>
            </div>
            <div class="bg-white rounded-lg shadow-sm p-4">
                <div class="text-2xl font-bold bg-green-600" id="stable-apis" style="color: #16a34a;">-</div>
                <div class="text-sm text-gray-600">Stable APIs</div>
            </div>
            <div class="bg-white rounded-lg shadow-sm p-4">
                <div class="text-2xl font-bold" id="experimental-apis" style="color: #ca8a04;">-</div>
                <div class="text-sm text-gray-600">Experimental</div>
            </div>
            <div class="bg-white rounded-lg shadow-sm p-4">
                <div class="text-2xl font-bold" id="latest-version" style="color: #2563eb;">-</div>
                <div class="text-sm text-gray-600">Latest Support</div>
            </div>
        </div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="container">
        <div class="text-center py-12">
            <div class="animate-spin rounded h-12 w-12 border-b" style="border-color: #3B82F6; margin: 0 auto;"></div>
            <p class="text-gray-600 mt-4">Loading compatibility data...</p>
        </div>
    </div>

    <!-- Main Content -->
    <div id="content" class="container pb-12 hidden">
        <div id="api-container" class="category-grid">
            <!-- API items will be inserted here -->
        </div>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="container hidden">
        <div class="text-center py-12">
            <div class="text-gray-400" style="font-size: 4rem; margin-bottom: 1rem;">🔍</div>
            <h3 class="text-lg font-medium text-gray-900 mb-2">No APIs found</h3>
            <p class="text-gray-600">Try adjusting your search or filters</p>
        </div>
    </div>

    <script src="compatibility-viewer.js"></script>
</body>
</html>
