<html>

<head>
  <meta charset="utf-8" />
  <title>Three.js: Cubemap-mipmap</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://ar.rokidcdn.com/web-assets/yodaos-jsar/dist/three/build/three.module.js",
        "three/addons/": "https://ar.rokidcdn.com/web-assets/yodaos-jsar/dist/three/examples/jsm/"
      }
    }
  </script>
  <style>
    body {
      background: transparent;
    }
  </style>
  <script type="module">
    import * as THREE from 'three';

    var camera, scene, renderer;
    var container = {
      width: 0,
      height: 0
    };

    async function init(cb) {
      container.width = window.innerWidth;
      container.height = window.innerHeight;

      camera = new THREE.PerspectiveCamera(65, container.width / container.height, 1, 2000);
      camera.position.z = 2000;
      camera.position.y = 400;
      camera.lookAt(new THREE.Vector3(0, 0, 0));


      scene = new THREE.Scene();

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(0, 1, 0);
      scene.add(light);

      const gl = navigator.gl;
      const session = await navigator.xr.requestSession('immersive-ar', {});
      const baseLayer = new XRWebGLLayer(session, gl);
      session.updateRenderState({ baseLayer });

      renderer = new THREE.WebGLRenderer({
        canvas: {
          addEventListener() { },
        },
        context: gl,
      });
      renderer.shadowMap.enabled = true;
      renderer.xr.enabled = true;
      renderer.xr.setReferenceSpaceType('local');
      renderer.xr.setSession(session);

      try {
        cb();
      } catch (err) {
        console.error('Error during initialization:', err);
      }

      // Start rendering
      renderer.setAnimationLoop(() => renderer.render(scene, camera));
    }

    async function loadCubeTexture() {
      const loader = new THREE.CubeTextureLoader();
      loader.setPath('https://threejs.org/examples/textures/cube/Bridge2/');
      return loader.load(['posx.jpg', 'negx.jpg', 'posy.jpg', 'negy.jpg', 'posz.jpg', 'negz.jpg']);
    }

    init(async () => {
      const envMap = await loadCubeTexture();
      // scene.background = envMap;
      // scene.environment = envMap;

      //model
      const sphere = new THREE.SphereGeometry(0.5, 128, 128);
      const material = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        envMap,
      });

      let mesh = new THREE.Mesh(sphere, material);
      mesh.position.set(-0.5, 0, -1.5);
      scene.add(mesh);

      const sphere2 = new THREE.SphereGeometry(0.5, 128, 128);
      const pbrMaterial = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0.2,
        roughness: 0.0,
        ior: 1.5,
        specularIntensity: 1.0,
        specularColor: new THREE.Color(0xffffff),
        envMap,
        envMapIntensity: 1.0,
        transmission: 1,
        side: THREE.DoubleSide,
        transparent: true,
      });

      let mesh2 = new THREE.Mesh(sphere2, pbrMaterial);
      mesh2.position.set(0.5, 0, -1.5);
      scene.add(mesh2);
    });
  </script>
</head>

<body>
</body>

</html>
