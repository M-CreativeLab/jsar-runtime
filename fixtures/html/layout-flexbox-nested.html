<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flexbox Nested Layout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }

    h1 {
      font-size: 58px;
      font-weight: bold;
      color: #fff;
    }

    h2,
    h3 {
      font-size: 45px;
      font-weight: bold;
      color: #c9d4df;
    }

    h4 {
      font-size: 35px;
      font-weight: bold;
      color: #fff;
    }

    p {
      font-size: 30px;
      color: #fff;
    }

    /* Outer Flex Container */
    .flex-container-outer {
      display: flex;
      flex-direction: column;
      border: none;
      box-sizing: border-box;
      background-color: #c9d4df5f;
      gap: 20px;
      padding: 20px;
      width: 100%;
      min-height: 80vh;
    }

    /* Inner Flex Containers */
    .flex-container-inner {
      display: flex;
      flex-direction: row;
      justify-content: space-around;
      align-items: center;
      background-color: rgba(200, 200, 200, 0.3);
      border-radius: 15px;
      padding: 15px;
      gap: 15px;
      flex: 1;
    }

    .flex-container-inner.vertical {
      flex-direction: column;
      justify-content: center;
    }

    /* Flex Items */
    .flex-item {
      background: rgba(0, 81, 255, 0.85);
      border-radius: 20px;
      padding: 25px;
      transform: translateZ(10px);
      text-align: center;
      flex: 1;
    }

    .flex-item:hover {
      background: rgba(255, 0, 0, 1);
      transform: translateZ(15px);
    }

    .flex-item.nested {
      background: rgba(0, 200, 100, 0.85);
      padding: 20px;
      margin: 5px;
    }

    .flex-item.nested:nth-child(2) {
      background: rgba(255, 150, 0, 0.85);
    }

    .flex-item.nested:nth-child(3) {
      background: rgba(150, 0, 255, 0.85);
    }

    /* Special nested container */
    .nested-flex-container {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: stretch;
      gap: 10px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 15px;
      margin: 10px 0;
    }

    /* Header */
    header {
      background: rgba(100, 5, 5, 0.706);
      color: white;
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>

<body style="background-color: #fff;">
  <header>
    <h1>Flexbox Nested Layout</h1>
  </header>

  <main class="flex-container-outer">
    <!-- First Row: Horizontal nested flex -->
    <section class="flex-container-inner">
      <div class="flex-item">
        <h3>Row 1 - Item 1</h3>
        <div class="nested-flex-container">
          <div class="flex-item nested">
            <h4>Nested A</h4>
          </div>
          <div class="flex-item nested">
            <h4>Nested B</h4>
          </div>
        </div>
      </div>
      
      <div class="flex-item">
        <h3>Row 1 - Item 2</h3>
        <p>Regular flex item</p>
      </div>
    </section>

    <!-- Second Row: Vertical nested flex -->
    <section class="flex-container-inner vertical">
      <div class="flex-item">
        <h3>Column Layout</h3>
        <div class="nested-flex-container">
          <div class="flex-item nested">
            <h4>Stack 1</h4>
          </div>
          <div class="flex-item nested">
            <h4>Stack 2</h4>
          </div>
          <div class="flex-item nested">
            <h4>Stack 3</h4>
          </div>
        </div>
      </div>
    </section>

    <!-- Third Row: Mixed layout -->
    <section class="flex-container-inner">
      <div class="flex-item">
        <h3>Mixed 1</h3>
      </div>
      <div class="flex-item">
        <h3>Mixed 2</h3>
        <div class="nested-flex-container">
          <div class="flex-item nested">
            <h4>Mix A</h4>
          </div>
          <div class="flex-item nested">
            <h4>Mix B</h4>
          </div>
        </div>
      </div>
      <div class="flex-item">
        <h3>Mixed 3</h3>
      </div>
    </section>
  </main>
</body>

</html>
