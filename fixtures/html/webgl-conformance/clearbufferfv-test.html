<html>

<head>
  <meta charset="utf-8" />
  <title>ClearBufferfv Test</title>
</head>

<body>
  <h1>Testing clearBufferfv function</h1>
</body>
<script>
  try {
    console.log('Starting clearBufferfv test...');

    const gl = navigator['gl'];
    if (!gl) {
      console.error('WebGL not available');
      alert('WebGL not available');
    } else {
      console.log('WebGL context obtained');
      console.log('WebGL version:', gl.getParameter(gl.VERSION));

      // Check WebGL2 support
      console.log('WebGL context type:', gl.constructor.name);
      console.log('WebGL version:', gl.getParameter(gl.VERSION));
      console.log('GLSL version:', gl.getParameter(gl.SHADING_LANGUAGE_VERSION));

      // Test clearBufferfv function
      console.log('Testing clearBufferfv function...');

      if (typeof gl.clearBufferfv === 'function') {
        console.log('clearBufferfv function is available');

        // Test different clearBufferfv calls
        const colorValues = new Float32Array([1.0, 0.0, 0.0, 1.0]);
        const colorValues2 = new Float32Array([0.0, 1.0, 0.0, 1.0]);
        const depthValue = new Float32Array([1.0]);

        console.log('Calling gl.clearBufferfv(gl.COLOR, 0, colorValues)');
        gl.clearBufferfv(gl.COLOR, 0, colorValues);
        console.log('Calling gl.clearBufferfv(gl.COLOR, 1, colorValues2)');
        gl.clearBufferfv(gl.COLOR, 1, colorValues2);
        console.log('Calling gl.clearBufferfv(gl.DEPTH, 0, depthValue)');
        gl.clearBufferfv(gl.DEPTH, 0, depthValue);

        console.log('clearBufferfv calls completed');
      } else {
        console.log('clearBufferfv function not found');
        alert('clearBufferfv function not found');
      }
    }
  } catch (error) {
    console.error('Error in clearBufferfv test:', error);
    alert('Error: ' + error.message);
  }
</script>

</html>
