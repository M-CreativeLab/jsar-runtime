<!DOCTYPE html>
<html>
<head>
    <title>WebGL bufferData(target, size, usage) Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test-result { margin: 10px 0; }
        .pass { color: green; }
        .fail { color: red; }
    </style>
</head>
<body>
    <h1>WebGL bufferData(target, size, usage) Test</h1>
    <canvas id="canvas" width="100" height="100"></canvas>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(message, isPass) {
            const div = document.createElement('div');
            div.className = `test-result ${isPass ? 'pass' : 'fail'}`;
            div.textContent = `${isPass ? '✅' : '❌'} ${message}`;
            results.appendChild(div);
        }
        
        function runTests() {
            const canvas = document.getElementById('canvas');
            const gl = canvas.getContext('webgl');
            
            if (!gl) {
                addResult('WebGL not supported', false);
                return;
            }
            
            try {
                // Test 1: Basic bufferData with size
                const buffer1 = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buffer1);
                gl.bufferData(gl.ARRAY_BUFFER, 1024, gl.STATIC_DRAW);
                
                const size1 = gl.getBufferParameter(gl.ARRAY_BUFFER, gl.BUFFER_SIZE);
                addResult(`bufferData(ARRAY_BUFFER, 1024, STATIC_DRAW) - Size: ${size1}`, size1 === 1024);
                
                // Test 2: Different buffer target
                const buffer2 = gl.createBuffer();
                gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, buffer2);
                gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, 512, gl.DYNAMIC_DRAW);
                
                const size2 = gl.getBufferParameter(gl.ELEMENT_ARRAY_BUFFER, gl.BUFFER_SIZE);
                addResult(`bufferData(ELEMENT_ARRAY_BUFFER, 512, DYNAMIC_DRAW) - Size: ${size2}`, size2 === 512);
                
                // Test 3: Different usage types
                const buffer3 = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buffer3);
                gl.bufferData(gl.ARRAY_BUFFER, 256, gl.STREAM_DRAW);
                
                const size3 = gl.getBufferParameter(gl.ARRAY_BUFFER, gl.BUFFER_SIZE);
                addResult(`bufferData(ARRAY_BUFFER, 256, STREAM_DRAW) - Size: ${size3}`, size3 === 256);
                
                // Test 4: Large buffer
                const buffer4 = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buffer4);
                gl.bufferData(gl.ARRAY_BUFFER, 1024 * 1024, gl.STATIC_DRAW);
                
                const size4 = gl.getBufferParameter(gl.ARRAY_BUFFER, gl.BUFFER_SIZE);
                addResult(`bufferData(ARRAY_BUFFER, 1MB, STATIC_DRAW) - Size: ${size4}`, size4 === 1024 * 1024);
                
                // Test 5: Verify we can still use the old bufferData with TypedArray
                const buffer5 = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buffer5);
                const data = new Float32Array([1.0, 2.0, 3.0, 4.0]);
                gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
                
                const size5 = gl.getBufferParameter(gl.ARRAY_BUFFER, gl.BUFFER_SIZE);
                addResult(`bufferData(ARRAY_BUFFER, Float32Array[4], STATIC_DRAW) - Size: ${size5}`, size5 === 16);
                
                addResult('All tests completed successfully!', true);
                
            } catch (error) {
                addResult(`Error during testing: ${error.message}`, false);
            }
        }
        
        // Run tests when page loads
        runTests();
    </script>
</body>
</html>
