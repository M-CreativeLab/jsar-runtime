<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flexbox Column Layout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }

    h1 {
      font-size: 58px;
      font-weight: bold;
      color: #fff;
    }

    h2,
    h3 {
      font-size: 45px;
      font-weight: bold;
      color: #c9d4df;
    }

    p {
      font-size: 30px;
      color: #fff;
    }

    /* Flexbox Column Container */
    .flex-container {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      border: none;
      box-sizing: border-box;
      background-color: #c9d4df5f;
      gap: 20px;
      padding: 20px;
      width: 100%;
      height: 80vh;
    }

    /* Flex Items */
    .flex-item {
      background: rgba(0, 81, 255, 0.85);
      border-radius: 20px;
      padding: 30px 50px;
      transform: translateZ(10px);
      width: 80%;
      text-align: center;
    }

    .flex-item:hover {
      background: rgba(255, 0, 0, 1);
      transform: translateZ(15px);
    }

    .flex-item:nth-child(2) {
      background: rgba(0, 200, 100, 0.85);
    }

    .flex-item:nth-child(3) {
      background: rgba(255, 150, 0, 0.85);
    }

    /* Header */
    header {
      background: rgba(100, 5, 5, 0.706);
      color: white;
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>

<body style="background-color: #fff;">
  <header>
    <h1>Flexbox Column Layout</h1>
  </header>

  <main class="flex-container">
    <section class="flex-item">
      <h3>Flex Item 1</h3>
      <p>First item in column layout</p>
    </section>

    <section class="flex-item">
      <h3>Flex Item 2</h3>
      <p>Second item in column layout</p>
    </section>

    <section class="flex-item">
      <h3>Flex Item 3</h3>
      <p>Third item in column layout</p>
    </section>
  </main>
</body>

</html>
