<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>HTMLIframeElement Test</title>
</head>
<body>
  <h1>HTMLIframeElement Creation Test</h1>
  
  <!-- Static iframe element in HTML -->
  <iframe id="static-iframe" src="about:blank" width="300" height="200"></iframe>
  
  <script>
    console.log("=== HTMLIframeElement Test ===");
    
    // Test 1: Create iframe element using createElement
    console.log("Test 1: Creating iframe with createElement");
    const iframe = document.createElement('iframe');
    console.log("✓ Created iframe element:", iframe.constructor.name);
    console.log("✓ tagName:", iframe.tagName);
    console.log("✓ nodeName:", iframe.nodeName);
    
    // Test 2: Set basic attributes
    console.log("\nTest 2: Setting iframe attributes");
    iframe.src = 'about:blank';
    iframe.width = '400';
    iframe.height = '300';
    iframe.id = 'dynamic-iframe';
    console.log("✓ Set src:", iframe.src);
    console.log("✓ Set width:", iframe.width);
    console.log("✓ Set height:", iframe.height);
    console.log("✓ Set id:", iframe.id);
    
    // Test 3: Add to document
    console.log("\nTest 3: Adding iframe to document");
    document.body.appendChild(iframe);
    console.log("✓ Appended to document body");
    
    // Test 4: Query iframe elements from document
    console.log("\nTest 4: Querying iframe elements");
    const allIframes = document.querySelectorAll('iframe');
    console.log("✓ Found", allIframes.length, "iframe elements");
    
    const staticIframe = document.getElementById('static-iframe');
    const dynamicIframe = document.getElementById('dynamic-iframe');
    console.log("✓ Found static iframe:", staticIframe !== null);
    console.log("✓ Found dynamic iframe:", dynamicIframe !== null);
    console.log("✓ Same dynamic element:", dynamicIframe === iframe);
    
    // Test 5: getElementsByTagName
    console.log("\nTest 5: getElementsByTagName");
    const iframesByTag = document.getElementsByTagName('iframe');
    console.log("✓ getElementsByTagName found", iframesByTag.length, "iframe elements");
    
    // Test 6: Verify element types
    console.log("\nTest 6: Verifying element types");
    console.log("✓ staticIframe instanceof Element:", staticIframe instanceof Element);
    console.log("✓ dynamicIframe instanceof Element:", dynamicIframe instanceof Element);
    
    console.log("\n🎉 All HTMLIframeElement tests completed successfully!");
  </script>
</body>
</html>
