<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flexbox Alignment Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }

    h1 {
      font-size: 58px;
      font-weight: bold;
      color: #fff;
    }

    h2,
    h3 {
      font-size: 45px;
      font-weight: bold;
      color: #c9d4df;
    }

    p {
      font-size: 30px;
      color: #fff;
    }

    /* Container for multiple alignment demos */
    .demo-container {
      margin: 20px 0;
      padding: 20px;
      background-color: #f0f0f05f;
      border-radius: 10px;
    }

    /* Flexbox Alignment Containers */
    .flex-center {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #c9d4df5f;
      height: 300px;
      gap: 20px;
      margin: 10px 0;
    }

    .flex-space-between {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      background-color: #c9d4df5f;
      height: 250px;
      gap: 20px;
      margin: 10px 0;
    }

    .flex-flex-end {
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      background-color: #c9d4df5f;
      height: 250px;
      gap: 20px;
      margin: 10px 0;
    }

    /* Flex Items */
    .flex-item {
      background: rgba(0, 81, 255, 0.85);
      border-radius: 20px;
      padding: 30px;
      transform: translateZ(10px);
      text-align: center;
      min-width: 200px;
    }

    .flex-item:hover {
      background: rgba(255, 0, 0, 1);
      transform: translateZ(15px);
    }

    .flex-item.small {
      padding: 20px;
      min-width: 150px;
    }

    .flex-item.large {
      padding: 40px;
      min-width: 250px;
    }

    .flex-item:nth-child(2) {
      background: rgba(0, 200, 100, 0.85);
    }

    .flex-item:nth-child(3) {
      background: rgba(255, 150, 0, 0.85);
    }

    /* Header */
    header {
      background: rgba(100, 5, 5, 0.706);
      color: white;
      text-align: center;
      padding: 1rem;
    }
  </style>
</head>

<body style="background-color: #fff;">
  <header>
    <h1>Flexbox Alignment Test</h1>
  </header>

  <div class="demo-container">
    <h2>Center Alignment</h2>
    <div class="flex-center">
      <section class="flex-item small">
        <h3>Center 1</h3>
      </section>
      <section class="flex-item">
        <h3>Center 2</h3>
      </section>
      <section class="flex-item large">
        <h3>Center 3</h3>
      </section>
    </div>
  </div>

  <div class="demo-container">
    <h2>Space Between & Stretch</h2>
    <div class="flex-space-between">
      <section class="flex-item">
        <h3>Stretch 1</h3>
        <p>Stretched height</p>
      </section>
      <section class="flex-item">
        <h3>Stretch 2</h3>
        <p>Equal height</p>
      </section>
      <section class="flex-item">
        <h3>Stretch 3</h3>
        <p>Auto stretch</p>
      </section>
    </div>
  </div>

  <div class="demo-container">
    <h2>Flex End Alignment</h2>
    <div class="flex-flex-end">
      <section class="flex-item small">
        <h3>End 1</h3>
      </section>
      <section class="flex-item">
        <h3>End 2</h3>
      </section>
    </div>
  </div>
</body>

</html>
