<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text</title>
  <style>
    main {
      padding: 30px;
    }

    h1,
    p {
      font-size: 100px;
    }
  </style>
</head>

<body style="background-color: #fff;">
  <main>
    <h1>Tool: </h1>
    <p>(?)</p>
  </main>
</body>

<script>
  const h1 = document.querySelector('h1');
  const p = document.querySelector('p');
  h1.firstChild.nodeValue += 'Timer';

  setInterval(() => {
    const now = new Date();
    p.textContent = `${now.getMilliseconds()}ms`;
  }, 1);
</script>

</html>
