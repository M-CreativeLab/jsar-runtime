<html>

<head>
  <meta charset="utf-8" />
  <title>WHATGW Fetch API</title>
  <script>
    fetch('https://example.com')
      .then(response => response.text())
      .then(text => console.log(text))
      .catch(error => console.error(error));

    fetch('https://example.com')
      .then(response => {
        console.info(response, response instanceof Response);
        console.info({
          url: response.url,
          ok: response.ok,
          status: response.status,
          statusText: response.statusText,
          type: response.type,
          redirected: response.redirected,
          bodyUsed: response.bodyUsed
        });
        console.info(response.body);
        return response.arrayBuffer();
      })
      .then(buffer => {
        console.log(buffer);
        console.log(buffer instanceof ArrayBuffer);
      });

      console.info('isPromise?', fetch('https://example.com') instanceof Promise);

      {
        // test blob response
        const blob = new Blob(['Hello, world!'], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        fetch(url)
          .then(async retrievedBlob => {
            console.info('retrieved blob:', await retrievedBlob.arrayBuffer());
            URL.revokeObjectURL(url);
          }).catch(err => {
            console.error('unexpected error fetching blob URL:', err);
          })
        console.info('sent blob URL:', url);
      }
  </script>
</head>

<body>
</body>

</html>
