<html>

<head>
  <meta charset="utf-8" />
  <title>DocumentFragment Test</title>
  <link rel="stylesheet" href="../css/global.css" />
  <style>
    .test-result {
      margin: 10px 0;
      padding: 5px;
      border: 1px solid #ccc;
    }

    .pass {
      background-color: #d4edda;
      border-color: #c3e6cb;
      color: #155724;
    }

    .fail {
      background-color: #f8d7da;
      border-color: #f5c6cb;
      color: #721c24;
    }
  </style>
</head>

<body>
  <h1>DocumentFragment Test</h1>
  <div id="test-container"></div>
  <div id="results"></div>
</body>

<script>
  function logResult(message, passed) {
    const resultsDiv = document.getElementById('results');
    const resultDiv = document.createElement('div');
    resultDiv.className = `test-result ${passed ? 'pass' : 'fail'}`;
    resultDiv.textContent = `${passed ? '✅ PASS' : '❌ FAIL'}: ${message}`;
    resultsDiv.appendChild(resultDiv);
    console.info(`${passed ? 'PASS' : 'FAIL'}: ${message}`);
  }

  // Test 1: Check if createDocumentFragment method exists
  logResult('document.createDocumentFragment method exists', typeof document.createDocumentFragment === 'function');

  // Test 2: Create a DocumentFragment
  let fragment;
  try {
    fragment = document.createDocumentFragment();
    logResult('createDocumentFragment() returns a value', fragment !== undefined && fragment !== null);
  } catch (error) {
    logResult(`createDocumentFragment() throws error: ${error.message}`, false);
    fragment = null;
  }

  if (fragment) {
    // Test 3: Check if it's a DocumentFragment
    logResult('Returns DocumentFragment object', fragment.constructor.name === 'DocumentFragment');

    // Test 4: Check node type
    logResult('DocumentFragment has correct nodeType', fragment.nodeType === Node.DOCUMENT_FRAGMENT_NODE);

    // Test 5: Check node name
    logResult('DocumentFragment has correct nodeName', fragment.nodeName === '#document-fragment');

    // Test 6: DocumentFragment should have no parent
    logResult('DocumentFragment has no parentNode', fragment.parentNode === null);

    // Test 7: DocumentFragment should initially have no children
    logResult('DocumentFragment initially has no children', fragment.childNodes.length === 0);

    // Test 8: Test appending elements to DocumentFragment
    try {
      const div1 = document.createElement('div');
      div1.textContent = 'First div';
      const div2 = document.createElement('div');
      div2.textContent = 'Second div';

      fragment.appendChild(div1);
      fragment.appendChild(div2);

      logResult('Can append children to DocumentFragment', fragment.childNodes.length === 2);
      logResult('Children have correct parent', fragment.childNodes[0].parentNode === fragment);
    } catch (error) {
      logResult(`Error appending to DocumentFragment: ${error.message}`, false);
    }

    // Test 9: Test using DocumentFragment with DOM insertion
    try {
      const container = document.getElementById('test-container');
      const testFragment = document.createDocumentFragment();

      for (let i = 1; i <= 3; i++) {
        const p = document.createElement('p');
        p.textContent = `Paragraph ${i}`;
        testFragment.appendChild(p);
      }

      const childCountBefore = testFragment.childNodes.length;
      container.appendChild(testFragment);
      const childCountAfter = testFragment.childNodes.length;

      logResult('DocumentFragment children moved to DOM (fragment empty after insertion)',
        childCountBefore === 3 && childCountAfter === 0);
      logResult('DOM container received children from fragment',
        container.children.length === 3);
    } catch (error) {
      logResult(`Error with DOM insertion: ${error.message}`, false);
    }

    // Test 10: Test DocumentFragment properties
    try {
      const testFragment = document.createDocumentFragment();
      const div = document.createElement('div');
      testFragment.appendChild(div);

      logResult('DocumentFragment childElementCount works',
        typeof testFragment.childElementCount === 'number' && testFragment.childElementCount === 1);
      logResult('DocumentFragment firstElementChild works',
        testFragment.firstElementChild === div);
      logResult('DocumentFragment lastElementChild works',
        testFragment.lastElementChild === div);
    } catch (error) {
      logResult(`Error testing DocumentFragment properties: ${error.message}`, false);
    }
  }

  console.info('DocumentFragment test completed');
</script>

</html>
